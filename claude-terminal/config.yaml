---
name: "Claude Terminal (WetDogNose)"
description: "Web terminal with Anthropic's Claude Code CLI and persistent auth"
# Fork versioning: <upstream base>-wdn.<n>, so the upstream release this is
# based on stays visible and tags never collide with upstream's. Bump on every
# deployable change -- the Supervisor compares version strings, so pushing new
# code under an unchanged version means HA never offers the update.
version: "2.5.1-wdn.5"
# Distinct from upstream's "claude_terminal" so both can be installed side by
# side. Changing this again creates a NEW add-on with an empty /data.
slug: "claude_terminal_wdn"

# Declared maturity, shown in the add-on store. This is a fork of a released
# upstream add-on running a stable toolchain, not an experiment.
stage: stable
init: false

# Prebuilt images on GHCR — the Supervisor pulls these instead of building
# locally (no build OOM, no image blobs in backups). Tag = version below.
# Must match the namespace .github/workflows/publish-images.yml pushes to
# (this repo's owner, lowercased); otherwise installs pull upstream's build
# rather than the one built from this tree.
image: "ghcr.io/wetdognose/{arch}-addon-claude-terminal"

# Supported architectures (armv7 dropped in 2.5.0: HAOS dropped 32-bit ARM,
# and neither Claude Code native builds nor managed Python exist for it)
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/WetDogNose/home-assistant-claude"

# Web interface configuration
ingress: true
ingress_port: 7681
panel_icon: mdi:code-braces
panel_title: "Claude Terminal"
panel_admin: true

# No `ports:` key by design. ttyd runs --writable and relies on ingress for
# authentication, so publishing a host port would put an unauthenticated root
# shell on the LAN. The terminal is reachable through the sidebar only.

# Add-on configuration options
options:
  auto_launch_claude: true
  require_ingress_user: false
  claude_auto_update: true
  claude_version: ""
  dangerously_skip_permissions: false
  claude_extra_args: ""
  ha_smart_context: true
  enable_ha_mcp: true
  ha_mcp_version: "7.11.0"
  enable_automation_api: true
  automation_api_port: 8128
  automation_api_key: ""
  git_user_name: ""
  git_user_email: ""
  persistent_apk_packages: []
  persistent_pip_packages: []
schema:
  auto_launch_claude: bool?
  # Require the X-Remote-User-Id header the ingress proxy injects.
  #
  # Defaults to FALSE, which is not the security-preferred value and is a
  # deliberate concession to how ingress actually behaves. The Supervisor
  # populates the identity headers only when the ingress session carries user
  # data; sessions created without it get no header at all. ttyd applies
  # --auth-header to the WebSocket upgrade as well as the page, so on such an
  # instance the panel loads and then immediately fails to connect -- "Press
  # Enter to Reconnect" forever, with no indication why.
  #
  # A hardening option that bricks the terminal for some users cannot be the
  # default. Turn it ON if your instance forwards the header: it is the only
  # thing stopping any authenticated Home Assistant user, or any co-resident
  # add-on, from reaching a root shell.
  require_ingress_user: bool?
  claude_auto_update: bool?
  # Empty means track the newest release. Set to stable, latest, or an exact
  # X.Y.Z to pin -- the escape hatch when an upstream Claude release cannot run
  # in this image, since that install happens at runtime and no build-time test
  # can catch it.
  claude_version: str?
  dangerously_skip_permissions: bool?
  claude_extra_args: str?
  ha_smart_context: bool?
  enable_ha_mcp: bool?
  ha_mcp_version: str?
  enable_automation_api: bool?
  automation_api_port: port?
  automation_api_key: str?
  # Commit identity for git operations from the terminal. GitHub itself is
  # authenticated interactively with `github-setup`, deliberately keeping the
  # token out of this file -- /data/options.json is plaintext and is included
  # in Home Assistant backups.
  git_user_name: str?
  git_user_email: str?
  persistent_apk_packages:
    - str
  persistent_pip_packages:
    - str

# Keep reproducible artefacts out of Home Assistant backups.
#
# /data is backed up in full, and it accumulates a uv-managed CPython, a uv
# wheel cache and a self-reinstalling Claude Code binary -- the same class of
# problem as the npm cache that bloated backups by gigabytes (#103).
#
# Patterns are relative to the add-on's data directory (i.e. to /data), NOT
# absolute container paths: the Supervisor matches them against the host path,
# so a leading "/data/..." silently matches nothing. Note HOME is /data/home
# while the XDG dirs sit at /data directly, hence the mixed prefixes below.
#
# Everything here is regenerated on the next boot (update_claude reinstalls
# Claude; setup-ha-mcp re-warms the uv environment). Deliberately NOT excluded,
# because they are irreplaceable user state: .config/claude and .config/gh
# (credentials), home/.claude.json and home/.claude/projects (session history),
# and persistent-packages.json. Note the exclusion is home/.claude/downloads
# specifically, not home/.claude, so conversation history survives.
backup_exclude:
  - ".cache/uv"                   # uv wheel cache (XDG_CACHE_HOME=/data/.cache)
  - ".local/share/uv/python"      # uv-managed CPython 3.13 (~150-250MB).
                                  # Narrow: .local/share/uv would also prune
                                  # uv/tools, i.e. user-installed tooling.
  - ".local/share/claude"         # Claude version store, if XDG-placed
  - "home/.local/share/claude"    # Claude version store, if HOME-placed
  - "home/.local/bin/claude"      # symlink into the version store above
  - "home/.claude/downloads"      # installer scratch ($HOME/.claude/downloads)
  - "home/.npm"                   # legacy npm cache (#103)

# Volume mappings for file access.
#
# `config` is deprecated in favour of `homeassistant_config`, but they mount at
# DIFFERENT paths (/config vs /homeassistant). The explicit `path: /config`
# keeps the historical mount, which everything depends on: WORKDIR in the
# Dockerfile, claude-login-url.sh writing /config/claude-login-url.txt, and the
# documented "terminal starts in /config". Without that path override this is a
# breaking change rather than a cleanup.
#
# Caveat for future edits: PATH_PUBLIC_CONFIG is also /config, so adding
# `addon_config`/`app_config` later without its own explicit path would collide
# on the same mount point.
#
# all_addon_configs is itself deprecated (2026.07) in favour of all_app_configs,
# deliberately NOT migrated: the replacement mounts at /app_configs rather than
# /addon_configs, and on any Supervisor older than 2026.07.2 the unknown type
# fails validation of this entire file, making the add-on unloadable.
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: all_addon_configs
    read_only: false
  - type: share
    read_only: false

# Ship a custom AppArmor profile (claude-terminal/apparmor.txt). Home Assistant
# disables seccomp for all add-ons, so without this the only mandatory access
# control for a container running an LLM as root is Docker's generic
# docker-default. The profile stays permissive INSIDE the container -- it must,
# the add-on is a shell -- and denies container-escape primitives instead.
# Also worth +1 on the Supervisor security rating.
#
# This MUST be a boolean, despite the documentation describing a string form
# ("you can also use custom profiles with the name of the profile"). The
# Supervisor validates it as vol.Boolean(), so a profile name here fails the
# whole file:
#   Can't read config.yaml: expected boolean for dictionary value
#   @ data['apparmor']. Got 'claude_terminal_wdn'
# and a config that fails to parse is skipped silently -- the add-on simply
# never appears in the store.
#
# The custom profile is picked up from claude-terminal/apparmor.txt on its own;
# the Supervisor installs it under the add-on slug, which is why the profile in
# that file is declared as `profile claude_terminal_wdn`.
apparmor: true

# API access for Home Assistant integration.
#
# auth_api is deliberately NOT granted. It unlocks exactly one endpoint --
# POST /auth, which validates a Home Assistant username/password on the add-on's
# behalf -- and nothing here calls it: ttyd runs without --credential, so there
# is no login form to consume it. It also contributes nothing to the security
# rating, because that scoring is "if ingress: +2 elif auth_api: +1" and ingress
# already wins.
#
# hassio_role is now `default`. It used to be `manager` for exactly one call --
# ha-context.sh listing installed add-ons via the Supervisor's /addons route --
# and manager additionally granted /backups (which can export every secret in
# the instance), /store, /host reboot, /os and /mounts, none of which anything
# here used. ha-context now derives the same list from the update entities
# Home Assistant already publishes, which come back in the states payload it
# was fetching anyway, so the grant is no longer needed.
#
# Everything else the add-on calls still works at default: /addons/self/info
# bypasses the role check entirely, /*/info is allowed at default, and the
# /core/api/* proxy is gated by homeassistant_api rather than by role.
#
# Worth +1 on the Supervisor security rating.
hassio_api: true
hassio_role: default
homeassistant_api: true

# Service startup configuration
startup: services
