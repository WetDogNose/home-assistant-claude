blueprint:
  name: Claude Terminal Task Trigger
  description: >
    Triggers an autonomous task in Claude Terminal via its secure Automation API
    endpoint when an event or schedule fires, with optional notification response.
  domain: automation
  input:
    task_prompt:
      name: Claude Task Prompt
      description: The instruction/prompt to send to Claude Code.
      selector:
        text:
          multiline: true
    api_url:
      name: Automation API URL
      description: The endpoint URL of the Claude Terminal Automation API.
      default: "http://127.0.0.1:8128/api/query"
      selector:
        text:
    api_token:
      name: API Token
      description: Token from /data/automation_api_token in Claude Terminal.
      selector:
        text:
    notify_service:
      name: Notification Service (Optional)
      description: Target notification service for output (e.g. notify.notify).
      default: notify.notify
      selector:
        text:

trigger: []

action:
  - service: rest_command.claude_terminal_query
    data:
      url: !input api_url
      token: !input api_token
      prompt: !input task_prompt
EOF
