name: Publish Images

# Builds the add-on for all architectures and pushes the images to GHCR.
# Home Assistant installs pull these prebuilt images (via the `image:` key in
# config.yaml) instead of building locally — which fixes build OOM on small
# boxes (#56) and stops the Supervisor from exporting the locally-built image
# into every backup (the second half of #103).
#
# Images publish to the GHCR namespace of whoever owns this repository, so a
# fork publishes to — and its config.yaml `image:` key must point at — its own
# namespace. The two must agree or the Supervisor pulls someone else's build.
# GHCR package names must be lowercase while a GitHub owner login may be
# mixed-case. home-assistant/builder already normalises this internally, so
# the explicit lowercasing below is belt-and-braces, not a fix for a real
# failure -- it just keeps the resolved namespace visible in the run log.

# Publishing is tag-driven: the image tag comes from config.yaml's version, so
# publishing on every push to main silently rewrote whatever tag the current
# version named. That made "2.5.1" mean different things over time, and since
# the Supervisor compares version strings it would not offer an update anyway.
# One v* tag now maps to exactly one immutable image. Use the local podman loop
# in DEVELOPMENT.md for day-to-day iteration.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # armv7 is not supported by current HA builder releases (32-bit ARM
        # was dropped upstream); armv7 installs keep building locally
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository_owner preserves the login's case (e.g. "WetDogNose");
      # the builder lowercases it anyway, so this is for log clarity.
      - name: Resolve GHCR namespace
        id: ns
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "Publishing to ghcr.io/${owner}"

      - name: Build and push add-on image
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/claude-terminal \
            --image "${{ matrix.arch }}-addon-claude-terminal" \
            --docker-hub "ghcr.io/${{ steps.ns.outputs.owner }}" \
            --addon
