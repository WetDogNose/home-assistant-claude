name: Security Scan

on:
  pull_request:
    branches: [main]
    paths:
      - "claude-terminal/Dockerfile"
      - "claude-terminal/run.sh"
      - ".github/workflows/security-scan.yml"
  # Also scan pushes to main: without this, a Dockerfile change landing
  # directly on main goes unscanned until the weekly cron, which can be six
  # days later -- and a release could ship in between.
  push:
    branches: [main]
    paths:
      - "claude-terminal/Dockerfile"
      - "claude-terminal/run.sh"
      - ".github/workflows/security-scan.yml"
  schedule:
    # Weekly scan to catch newly disclosed CVEs
    - cron: "23 7 * * 1"

permissions:
  # Declaring any permissions block sets every unlisted scope to `none`, so
  # contents: read is required or actions/checkout fails with "Repository not
  # found" and the scan never runs -- silently, including the weekly cron.
  contents: read
  security-events: write

jobs:
  trivy:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./claude-terminal
          push: false
          load: true
          tags: scan/claude-terminal:latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: scan/claude-terminal:latest
          format: table
          output: trivy-results.txt
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Post results to job summary
        if: always()
        run: |
          echo "## Container Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -s trivy-results.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat trivy-results.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No HIGH or CRITICAL vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: scan/claude-terminal:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      # Non-fatal: publishing to the Security tab requires code scanning, which
      # on a private repository needs GitHub Advanced Security. Without it this
      # step fails with "Resource not accessible by integration" and would mask
      # the scan result, which is the part that actually matters -- the findings
      # are in the job summary above regardless. Drop continue-on-error if the
      # repo becomes public or gains Advanced Security.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
