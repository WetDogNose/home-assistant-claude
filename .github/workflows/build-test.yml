name: Build & Smoke Test

# Runs on pushes to main as well as PRs. Publishing is tag-driven, so without
# the push trigger a commit landing directly on main is never built, and the
# first build would happen at release time -- where a failure means a failed
# release.
#
# Deliberately NO paths: filter, despite most changes not touching the image.
# These checks are REQUIRED by branch protection, and a required check that a
# path filter skips never reports at all -- GitHub reads "never reported" as
# still pending, so the pull request can never merge. Always running costs
# ~1.5 min per PR; the alternative is a docs change that is unmergeable.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: claude-terminal/Dockerfile
          failure-threshold: error
          # HA add-ons use BUILD_FROM arg for base image and Alpine rolling packages
          ignore: DL3006,DL3018

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v7

      # build.yaml is the single source of truth for the base image. Hardcoding
      # it here as well let CI pass green against a different base than the one
      # a release is actually built on -- it was previously specified in three
      # places with nothing keeping them in agreement.
      - name: Resolve base image from build.yaml
        id: base
        run: |
          image=$(yq -r '.build_from."${{ matrix.arch }}"' claude-terminal/build.yaml)
          if [ -z "$image" ] || [ "$image" = "null" ]; then
            echo "::error::build.yaml has no build_from entry for ${{ matrix.arch }}"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Base image for ${{ matrix.arch }}: $image"

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: ./claude-terminal
          push: false
          # Loaded on both arches now: the emulated image is needed to check that
          # relocations resolve. provenance:false keeps buildx emitting a plain
          # image rather than a manifest list, which `docker run` cannot load.
          load: true
          provenance: false
          platforms: ${{ matrix.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          tags: test/claude-terminal:${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}

      - name: Smoke test — scripts are executable
        run: |
          docker run --rm -i --entrypoint /bin/bash \
            test/claude-terminal:${{ matrix.arch }} -s <<'SMOKE'
          rc=0
          for script in \
            /run.sh \
            /opt/scripts/setup-ha-mcp.sh \
            /opt/scripts/health-check.sh \
            /opt/scripts/persist-install.sh \
            /opt/scripts/ha-context.sh \
            /opt/scripts/github-setup.sh \
            /opt/scripts/claude-launch.sh \
            /opt/scripts/welcome.sh; do
            if [ -x "$script" ]; then echo "OK: $script"; else
              echo "FAIL: $script is not executable"; rc=1
            fi
          done
          exit $rc
          SMOKE

      # Relocation check on BOTH arches. ldd resolves symbols without executing,
      # so it is safe under QEMU where running a JIT binary is not (failure #2 in
      # this repo's history was V8 SIGILL under qemu-user). This is the check
      # that catches the 2.5.1 class: present, +x, aborts on exec.
      - name: Smoke test — relocations resolve
        run: |
          docker run --rm -i --entrypoint /bin/bash \
            test/claude-terminal:${{ matrix.arch }} -s <<'SMOKE'
          rc=0
          for bin in claude gh ttyd tmux node jq curl uv git; do
            p=$(command -v "$bin") || { echo "FAIL: $bin not found"; rc=1; continue; }
            out=$(ldd "$p" 2>&1 || true)
            if printf '%s' "$out" | grep -q 'symbol not found'; then
              echo "FAIL: $bin has unresolved symbols against this base image:"
              printf '%s\n' "$out" | grep 'symbol not found'
              rc=1
            else
              echo "OK(ldd): $bin"
            fi
          done
          exit $rc
          SMOKE

      # Actually EXECUTE the binaries. Only on the native arch: emulating a JIT
      # runtime under qemu-user is a known-flaky signal here, and a test that
      # flakes gets muted, which is worse than not having it.
      - name: Smoke test — binaries actually run
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm -i --entrypoint /bin/bash \
            test/claude-terminal:amd64 -s <<'SMOKE'
          rc=0
          check() {
            name=$1; shift
            if out=$(timeout 30 "$@" 2>&1); then
              echo "OK: $name -> $(printf '%s' "$out" | head -1)"
            else
              echo "FAIL: $name did not run: $(printf '%s' "$out" | head -3)"
              rc=1
            fi
          }
          check claude  claude --version
          check gh      gh --version
          check uv      uv --version
          check node    node --version
          check npm     npm --version
          check git     git --version
          check jq      jq --version
          check tmux    tmux -V
          check python3 python3 --version
          check yq      yq --version
          exit $rc
          SMOKE

      # Record what the floating dependencies actually resolved to, so a future
      # breakage can be correlated with what moved rather than guessed at.
      - name: Record resolved dependency versions
        if: always()
        run: |
          {
            echo "## Resolved versions — ${{ matrix.arch }}"
            echo ""
            echo "Base image: \`${{ steps.base.outputs.image }}\`"
            echo ""
            echo '```'
            docker run --rm -i --entrypoint /bin/bash \
              test/claude-terminal:${{ matrix.arch }} -s <<'SMOKE' || true
          cat /usr/local/share/claude-terminal/build-versions.json 2>/dev/null || echo '{}'
          echo "alpine: $(cat /etc/alpine-release)"
          apk info -v 2>/dev/null | sort | grep -E '^(git|github-cli|nodejs|npm|tmux|ttyd|python3|jq|curl|yq-go)-[0-9]' || true
          SMOKE
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
