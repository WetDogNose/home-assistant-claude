name: Build & Smoke Test

# Runs on pushes to main as well as PRs. Publishing is tag-driven, so without
# the push trigger a commit landing directly on main is never built, and the
# first build would happen at release time -- where a failure means a failed
# release.
#
# Deliberately NO paths: filter, despite most changes not touching the image.
# These checks are REQUIRED by branch protection, and a required check that a
# path filter skips never reports at all -- GitHub reads "never reported" as
# still pending, so the pull request can never merge. Always running costs
# ~1.5 min per PR; the alternative is a docs change that is unmergeable.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs: pushing twice to a PR should not leave the first
# build burning minutes on a commit nobody will merge.
# Least privilege: this workflow only reads the repository. Without an explicit
# block the job inherits the repository default, which can be widened later
# without anyone revisiting the workflows.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: claude-terminal/Dockerfile
          failure-threshold: error
          # HA add-ons use BUILD_FROM arg for base image and Alpine rolling packages
          ignore: DL3006,DL3018

  docs:
    name: Docs & options drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check options are labelled and documented
        run: ./ci/check-docs-drift.sh

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # build.yaml is the single source of truth for the base image. Hardcoding
      # it here as well let CI pass green against a different base than the one
      # a release is actually built on -- it was previously specified in three
      # places with nothing keeping them in agreement.
      - name: Resolve base image from build.yaml
        id: base
        run: |
          image=$(yq -r '.build_from."${{ matrix.arch }}"' claude-terminal/build.yaml)
          if [ -z "$image" ] || [ "$image" = "null" ]; then
            echo "::error::build.yaml has no build_from entry for ${{ matrix.arch }}"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Base image for ${{ matrix.arch }}: $image"

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./claude-terminal
          push: false
          # Loaded on both arches now: the emulated image is needed to check that
          # relocations resolve. provenance:false keeps buildx emitting a plain
          # image rather than a manifest list, which `docker run` cannot load.
          load: true
          provenance: false
          # Layer cache keyed per architecture. The apk layer dominates build
          # time and changes rarely, so most PRs now rebuild only the Claude
          # fetch and the COPY layers.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          platforms: ${{ matrix.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          tags: test/claude-terminal:${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}

      # Shared with the canary and runnable locally: ci/smoke.sh <image> [--exec]
      - name: Smoke test
        run: |
          ./ci/smoke.sh test/claude-terminal:${{ matrix.arch }} \
            ${{ matrix.arch == 'amd64' && '--exec' || '' }}

      # #18: actually start the thing. Native arch only -- booting a full
      # add-on under QEMU is slow and the boot path is not arch-specific.
      - name: Boot test
        if: matrix.arch == 'amd64'
        run: ./ci/boot-test.sh test/claude-terminal:amd64

      # Record what the floating dependencies actually resolved to, so a future
      # breakage can be correlated with what moved rather than guessed at.
      - name: Record resolved dependency versions
        if: always()
        run: |
          {
            echo "## Resolved versions — ${{ matrix.arch }}"
            echo ""
            echo "Base image: \`${{ steps.base.outputs.image }}\`"
            echo ""
            echo '```'
            ./ci/smoke.sh test/claude-terminal:${{ matrix.arch }} 2>/dev/null \
              | sed -n '/^== versions ==/,$p' | tail -n +2 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
