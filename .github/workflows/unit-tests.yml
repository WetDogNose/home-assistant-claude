name: Automated Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run Unit Tests & Script Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ShellCheck & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck jq yq
          # setup-python installs a clean interpreter with no PyYAML, while both
          # ci/check-docs-drift.sh and the blueprint checks in
          # tests/test_scripts.sh parse YAML from Python. Without this they fall
          # through to whatever `ruby` the runner image happens to ship, which
          # is not a dependency this repository declares anywhere.
          python3 -m pip install --upgrade pyyaml

      - name: Run Local Validation Suite
        run: |
          chmod +x ci/local-validate.sh tests/test_scripts.sh claude-terminal/scripts/*.sh
          ./ci/local-validate.sh
