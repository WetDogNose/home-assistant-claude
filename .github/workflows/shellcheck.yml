name: ShellCheck

# Pushes to main are linted too -- see the note in build-test.yml: nothing else
# gates a commit that lands on main without a PR. No paths: filter for the same
# reason given there: this check is required by branch protection, and a
# path-skipped required check leaves the PR pending forever.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs: pushing twice to a PR should not leave the first
# build burning minutes on a commit nobody will merge.
# Least privilege: this workflow only reads the repository. Without an explicit
# block the job inherits the repository default, which can be widened later
# without anyone revisiting the workflows.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: claude-terminal
          severity: warning
          # SC1008: unsupported shebang (#!/usr/bin/with-contenv bashio is valid for HA add-ons)
          # SC1091: sourced files not available in CI (bashio, HA runtime scripts)
          additional_files: run.sh
          ignore_names: tmux.conf
        env:
          SHELLCHECK_OPTS: "-s bash -e SC1008 -e SC1091"
