version: 2

updates:
  # GitHub Actions are pinned to mutable major tags (@v4, @v6). A tag can be
  # repointed by whoever controls the action, so the pin proves nothing about
  # what runs. Dependabot raises PRs as new releases land, which is what makes
  # moving to immutable SHA pins practical to maintain rather than a one-off
  # that rots.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      # One PR for routine action bumps rather than five; security updates are
      # still raised individually and immediately.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # home-assistant/builder is pinned to 2026.02.1 on purpose. Later tags
      # exist in git but their builder images were never published to ghcr.io
      # -- 2026.06.0 still returns HTTP 404, and pulling it fails with
      # "manifest unknown", which is what broke every publish job and prompted
      # the pin in 9008b35.
      #
      # This is exactly the bump CI cannot catch: publish-images.yml runs only
      # on v* tags, so the first execution of a bad builder version would be a
      # release. Unignore only after confirming the image exists:
      #   curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" \
      #     https://ghcr.io/v2/home-assistant/amd64-builder/manifests/<version>
      - dependency-name: home-assistant/builder

  # The base image is declared in claude-terminal/build.yaml rather than a
  # FROM line, so Dockerfile ecosystem support cannot see it -- the daily
  # canary is what watches for base image drift. This entry covers any
  # concrete FROM that gets added later.
  - package-ecosystem: docker
    directory: "/claude-terminal"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
    labels:
      - dependencies
